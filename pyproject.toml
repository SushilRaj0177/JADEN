[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaden"
version = "0.2.0"
description = "Japanese Address Data Engineering & Normalization Engine (JADEN)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sushil Raj", email = "sushilraj0177@gmail.com"}
]
keywords = [
    "japanese-address",
    "normalization",
    "geocoding",
    "address-base-registry",
    "jis-x-0401",
    "jis-x-0402",
    "kyoto-address",
    "finite-state-machine"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SushilRaj0177/JADEN"
Repository = "https://github.com/SushilRaj0177/JADEN.git"
Issues = "https://github.com/SushilRaj0177/JADEN/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
jaden = "jaden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jaden = ["py.typed"]
"jaden.data" = ["*.json", "*.tsv.gz"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: marks tests that require live external network access",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness rules only (pyflakes + syntax/runtime errors); style is not enforced mechanically
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["src/jaden"]
warn_unused_ignores = true

[tool.ruff.lint.per-file-ignores]
# stdout/stderr are switched to UTF-8 before the package imports run (Windows consoles)
"src/jaden/cli.py" = ["E402"]
